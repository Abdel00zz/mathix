[package]
name = "mathix_frontend"
version = "1.0.0"
edition.workspace = true
description = "Frontend 100% Rust/WebAssembly de Mathix (SPA Élève + Console Admin & Studio isolée par feature)."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
admin = []

[dependencies]
serde_json = { path = "../shared/serde_json" }
math_engine = { path = "../math_engine", default-features = false }
json_engine = { path = "../json_engine", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm_abi = { path = "../shared/wasm_abi" }
