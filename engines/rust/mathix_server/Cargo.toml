[package]
name = "mathix_server"
version = "2.1.0"
edition.workspace = true
description = "Serveur HTTP + API persistante natif Rust de Mathix (zéro dépendance externe)."

[[bin]]
name = "mathix-server"
path = "src/main.rs"

[dependencies]
serde_json = { path = "../shared/serde_json" }
math_engine = { path = "../math_engine" }
json_engine = { path = "../json_engine" }
