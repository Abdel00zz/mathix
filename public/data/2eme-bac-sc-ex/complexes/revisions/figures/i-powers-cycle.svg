<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Cycle des puissances de i</title>
  <desc id="desc">Le cycle de période quatre des puissances de i sur le cercle unité.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9z" fill="#527b85"/></marker>
    <style>.t{font-family:'Latin Modern Math','STIX Two Text','Cambria Math',serif;fill:#111}.s{font-family:Arial,sans-serif;fill:#555}.a{stroke:#111;stroke-width:1.8}.arc{fill:none;stroke:#222;stroke-width:1.7;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="800" height="520" fill="#fff"/>
  <circle cx="400" cy="260" r="164" fill="none" stroke="#aaa" stroke-width="1.2"/>
  <path class="a" d="M196 260H604M400 464V56"/><path class="arc" d="M520 148A164 164 0 0 1 556 260"/><path class="arc" d="M512 380A164 164 0 0 1 400 424"/><path class="arc" d="M280 372A164 164 0 0 1 244 260"/><path class="arc" d="M288 140A164 164 0 0 1 400 96"/>
  <g font-size="31" text-anchor="middle"><circle cx="564" cy="260" r="6" fill="#111"/><text class="t" x="624" y="270">i⁰ = 1</text><circle cx="400" cy="96" r="6" fill="#111"/><text class="t" x="400" y="54">i¹ = i</text><circle cx="236" cy="260" r="6" fill="#111"/><text class="t" x="136" y="270">i² = −1</text><circle cx="400" cy="424" r="6" fill="#111"/><text class="t" x="400" y="486">i³ = −i</text></g>
  <text class="t" x="400" y="253" font-size="30" text-anchor="middle">i⁴ = 1</text><text class="s" x="400" y="282" font-size="16" text-anchor="middle" letter-spacing="1">PÉRIODE 4</text>
</svg>
