<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Forme algébrique dans le plan complexe</title>
  <desc id="desc">Le point M d'affixe z égal à a plus ib, avec ses projections sur les axes réel et imaginaire.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9z" fill="#405b67"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dce7e8" stroke-width="1"/></pattern>
    <style>.t{font-family:'Latin Modern Math','STIX Two Text','Cambria Math',serif;fill:#111}.s{font-family:Arial,sans-serif;fill:#555}.a{stroke:#111;stroke-width:2.1}.d{stroke:#777;stroke-width:1.45;stroke-dasharray:5 5}</style>
  </defs>
  <rect width="800" height="520" fill="#fff"/><rect x="54" y="54" width="692" height="392" fill="url(#grid)"/>
  <path class="a" d="M74 400H724" marker-end="url(#arrow)"/><path class="a" d="M120 426V74" marker-end="url(#arrow)"/>
  <text class="t" x="704" y="390" font-size="27">Re</text><text class="t" x="130" y="95" font-size="27">Im</text>
  <path class="d" d="M120 400L560 400M560 400V160"/><path d="M120 400L560 160" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#arrow)"/>
  <circle cx="560" cy="160" r="6" fill="#111"/><text class="t" x="576" y="151" font-size="29">M(z)</text>
  <text class="t" x="315" y="250" font-size="31">z = a + ib</text>
  <text class="t" x="333" y="428" font-size="25">a = Re(z)</text><text class="t" x="570" y="286" font-size="25">b = Im(z)</text>
  <circle cx="120" cy="400" r="5" fill="#405b67"/><text class="t" x="95" y="429" font-size="23">O</text>
  <text class="s" x="72" y="482" font-size="17" letter-spacing="1">LECTURE GÉOMÉTRIQUE DE LA FORME ALGÉBRIQUE</text>
</svg>
