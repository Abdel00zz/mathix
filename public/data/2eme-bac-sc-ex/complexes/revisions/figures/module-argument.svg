<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Module et argument d'un complexe</title>
  <desc id="desc">Le module est la distance OM et l'argument est l'angle entre l'axe réel et OM.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0L8,4.5L0,9z" fill="#405b67"/></marker><style>.t{font-family:KaTeX_Main, Cambria Math, Georgia, serif;fill:#28434f}.s{font-family:Arial,sans-serif;fill:#718187}.a{stroke:#405b67;stroke-width:2.5}.d{stroke:#adc1c4;stroke-width:2;stroke-dasharray:7 7}</style></defs>
  <rect width="800" height="520" rx="18" fill="#fcfdfd"/><path class="a" d="M78 410H728" marker-end="url(#arrow)"/><path class="a" d="M140 448V70" marker-end="url(#arrow)"/>
  <text class="t" x="695" y="397" font-size="26">Re</text><text class="t" x="150" y="96" font-size="26">Im</text>
  <path class="d" d="M560 410V174H140"/><path d="M140 410L560 174" fill="none" stroke="#4d7f86" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="560" cy="174" r="9" fill="#c59a54"/><text class="t" x="579" y="164" font-size="30">M(z)</text>
  <path d="M224 410A86 86 0 0 0 207 369" fill="none" stroke="#c59a54" stroke-width="4"/><text class="t" x="238" y="366" font-size="31">θ</text>
  <text class="t" x="326" y="278" font-size="31" fill="#4d7f86">|z| = OM</text><text class="t" x="438" y="440" font-size="25">a</text><text class="t" x="575" y="304" font-size="25">b</text>
  <text class="s" x="78" y="482" font-size="17" letter-spacing="1">LONGUEUR ET DIRECTION DU POINT D'AFFIXE z</text>
</svg>
