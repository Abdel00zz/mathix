<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Rotation dans le plan complexe</title>
  <desc id="desc">Multiplier une affixe par e puissance i theta réalise une rotation de centre O et d'angle theta.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0L8,4.5L0,9z" fill="#405b67"/></marker><style>.t{font-family:KaTeX_Main, Cambria Math, Georgia, serif;fill:#28434f}.s{font-family:Arial,sans-serif;fill:#718187}.a{stroke:#405b67;stroke-width:2.5}</style></defs>
  <rect width="800" height="520" rx="18" fill="#fcfdfd"/><path class="a" d="M64 410H738" marker-end="url(#arrow)"/><path class="a" d="M182 456V62" marker-end="url(#arrow)"/>
  <circle cx="182" cy="410" r="7" fill="#405b67"/><text class="t" x="160" y="440" font-size="25">O</text>
  <path d="M182 410L580 300" fill="none" stroke="#97adb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M182 410L404 126" fill="none" stroke="#4d7f86" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M455 334A276 276 0 0 0 392 173" fill="none" stroke="#c59a54" stroke-width="4" marker-end="url(#arrow)"/><text class="t" x="442" y="244" font-size="32">θ</text>
  <circle cx="580" cy="300" r="9" fill="#97adb1"/><circle cx="404" cy="126" r="9" fill="#4d7f86"/><text class="t" x="596" y="296" font-size="29">A(z)</text><text class="t" x="419" y="121" font-size="29">A′(z′)</text>
  <text class="t" x="330" y="463" font-size="30">z′ = eⁱᶿ z</text><text class="s" x="70" y="488" font-size="17" letter-spacing="1">ROTATION DE CENTRE O ET D'ANGLE θ</text>
</svg>
