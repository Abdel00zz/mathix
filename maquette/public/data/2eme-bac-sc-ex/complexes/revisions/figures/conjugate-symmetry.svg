<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Symétrie d'un complexe et de son conjugué</title>
  <desc id="desc">Les points d'affixes z et conjugué de z sont symétriques par rapport à l'axe réel.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0L8,4.5L0,9z" fill="#405b67"/></marker><style>.t{font-family:KaTeX_Main, Cambria Math, Georgia, serif;fill:#28434f}.s{font-family:Arial,sans-serif;fill:#718187}.a{stroke:#405b67;stroke-width:2.5}.d{stroke:#9db6bb;stroke-width:2;stroke-dasharray:7 7}</style></defs>
  <rect width="800" height="520" rx="18" fill="#fcfdfd"/><path class="a" d="M72 260H730" marker-end="url(#arrow)"/><path class="a" d="M132 446V72" marker-end="url(#arrow)"/>
  <text class="t" x="696" y="247" font-size="26">Re</text><text class="t" x="142" y="95" font-size="26">Im</text>
  <path class="d" d="M132 260H548M548 132V388"/><path d="M132 260L548 132" fill="none" stroke="#5b8792" stroke-width="3.5"/><path d="M132 260L548 388" fill="none" stroke="#7f9d8d" stroke-width="3.5"/>
  <circle cx="548" cy="132" r="9" fill="#5b8792"/><circle cx="548" cy="388" r="9" fill="#7f9d8d"/>
  <text class="t" x="568" y="126" font-size="29">M(z)</text><text class="t" x="568" y="413" font-size="29">M′(z̄)</text>
  <path d="M612 140V380" fill="none" stroke="#c59a54" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="t" x="630" y="270" font-size="25">2b</text><text class="t" x="320" y="238" font-size="29">z = a + ib</text><text class="t" x="314" y="295" font-size="29">z̄ = a − ib</text>
  <text class="s" x="72" y="482" font-size="17" letter-spacing="1">SYMÉTRIE PAR RAPPORT À L'AXE RÉEL</text>
</svg>
