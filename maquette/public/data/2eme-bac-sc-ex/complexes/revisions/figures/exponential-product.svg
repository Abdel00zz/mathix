<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Produit de deux complexes en forme exponentielle</title>
  <desc id="desc">Le produit additionne les arguments et multiplie les modules.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0L8,4.5L0,9z" fill="#405b67"/></marker><style>.t{font-family:KaTeX_Main, Cambria Math, Georgia, serif;fill:#28434f}.s{font-family:Arial,sans-serif;fill:#718187}.a{stroke:#405b67;stroke-width:2.5}.arc{fill:none;stroke-width:3.5}</style></defs>
  <rect width="800" height="520" rx="18" fill="#fcfdfd"/><circle cx="270" cy="250" r="160" fill="#f5f9f9" stroke="#c3d4d6" stroke-width="2"/><path class="a" d="M72 250H474M270 454V48"/>
  <path d="M270 250L390 156" fill="none" stroke="#5b8792" stroke-width="4" marker-end="url(#arrow)"/><path d="M270 250L225 108" fill="none" stroke="#c59a54" stroke-width="4" marker-end="url(#arrow)"/><path d="M270 250L105 204" fill="none" stroke="#4d7f86" stroke-width="5" marker-end="url(#arrow)"/>
  <path class="arc" d="M334 200A82 82 0 0 0 285 170" stroke="#5b8792"/><path class="arc" d="M281 166A86 86 0 0 0 243 169" stroke="#c59a54"/><text class="t" x="389" y="142" font-size="26">z₁</text><text class="t" x="208" y="100" font-size="26">z₂</text><text class="t" x="86" y="195" font-size="26">z₁z₂</text>
  <path d="M520 112H734" stroke="#d5e1e2"/><text class="t" x="520" y="165" font-size="28">arg(z₁z₂) = θ₁ + θ₂</text><text class="t" x="520" y="235" font-size="28">|z₁z₂| = |z₁| · |z₂|</text><path d="M520 278H734" stroke="#d5e1e2"/>
  <text class="t" x="520" y="345" font-size="30">r₁eⁱᶿ¹ · r₂eⁱᶿ²</text><text class="t" x="520" y="387" font-size="30">= r₁r₂eⁱ⁽ᶿ¹⁺ᶿ²⁾</text><text class="s" x="520" y="430" font-size="16" letter-spacing="1">MODULES ×  •  ARGUMENTS +</text>
</svg>
