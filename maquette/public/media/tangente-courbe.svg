<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="420" height="260" rx="12" fill="#fcfbf9"/>
  <!-- Grille douce -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="60" x2="390" y2="60"/>
    <line x1="40" y1="110" x2="390" y2="110"/>
    <line x1="40" y1="160" x2="390" y2="160"/>
    <line x1="120" y1="25" x2="120" y2="230"/>
    <line x1="210" y1="25" x2="210" y2="230"/>
    <line x1="300" y1="25" x2="300" y2="230"/>
  </g>
  <!-- Axes -->
  <line x1="35" y1="210" x2="395" y2="210" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="70" y1="238" x2="70" y2="20" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="385" y="228" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1e293b">x</text>
  <text x="52" y="32" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1e293b">y</text>

  <!-- Courbe (C_f) -->
  <path d="M 55 195 Q 150 205 210 135 T 355 32" fill="none" stroke="#1b3a6b" stroke-width="3" stroke-linecap="round"/>
  <text x="322" y="55" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="15" fill="#1b3a6b">(C_f)</text>

  <!-- Tangente (T) en A(x_0, f(x_0)) -->
  <line x1="105" y1="218" x2="335" y2="36" stroke="#b8332a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="315" y="82" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="13.5" fill="#b8332a">(T) : y = f'(x₀)(x − x₀) + f(x₀)</text>

  <!-- Pointillés de projection -->
  <line x1="210" y1="135" x2="210" y2="210" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="70" y1="135" x2="210" y2="135" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="202" y="228" font-family="Georgia, serif" font-style="italic" font-size="13.5" fill="#0f172a">x₀</text>
  <text x="30" y="139" font-family="Georgia, serif" font-style="italic" font-size="13.5" fill="#0f172a">f(x₀)</text>

  <!-- Point A -->
  <circle cx="210" cy="135" r="5.5" fill="#ffffff" stroke="#b8332a" stroke-width="2.5"/>
  <text x="188" y="123" font-family="Georgia, serif" font-weight="bold" font-size="14" fill="#0f172a">A</text>
</svg>
