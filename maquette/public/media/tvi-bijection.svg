<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250">
  <rect width="420" height="250" rx="12" fill="#fcfbf9"/>
  <!-- Axes -->
  <line x1="35" y1="145" x2="395" y2="145" stroke="#334155" stroke-width="1.6"/>
  <line x1="75" y1="225" x2="75" y2="25" stroke="#334155" stroke-width="1.6"/>
  <text x="382" y="163" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1e293b">x</text>
  <text x="58" y="36" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1e293b">y</text>

  <!-- Courbe strictement croissante coupant l'axe des abscisses en alpha -->
  <path d="M 110 205 C 165 195, 215 110, 330 48" fill="none" stroke="#0f766e" stroke-width="3"/>

  <!-- Bornes a et b -->
  <line x1="110" y1="145" x2="110" y2="205" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <line x1="75" y1="205" x2="110" y2="205" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <circle cx="110" cy="205" r="4.5" fill="#0f766e"/>
  <text x="106" y="138" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#0f172a">a</text>
  <text x="32" y="209" font-family="Georgia, serif" font-style="italic" font-size="12.5" fill="#b8332a">f(a) &lt; 0</text>

  <line x1="330" y1="145" x2="330" y2="48" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <line x1="75" y1="48" x2="330" y2="48" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <circle cx="330" cy="48" r="4.5" fill="#0f766e"/>
  <text x="326" y="162" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#0f172a">b</text>
  <text x="28" y="52" font-family="Georgia, serif" font-style="italic" font-size="12.5" fill="#1f6b4a">f(b) &gt; 0</text>

  <!-- Unique racine alpha -->
  <circle cx="212" cy="145" r="6" fill="#ffffff" stroke="#b8332a" stroke-width="2.5"/>
  <text x="206" y="168" font-family="Georgia, serif" font-weight="bold" font-size="14.5" fill="#b8332a">α</text>
  <text x="148" y="232" font-family="Georgia, serif" font-size="13" fill="#334155">TVI : ∃! α ∈ ]a, b[ tel que f(α) = 0</text>
</svg>
